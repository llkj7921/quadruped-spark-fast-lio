# Added for the quadruped Livox Mid-360 integration by llkj09203-collab,
# 2026-11-20. Distributed with the GPL v2 FAST-LIO package.
launch:
  - arg: {name: start_rviz, default: 'true'}
  - arg: {name: config_path, default: $(find-pkg-share spark_fast_lio)/config/mid360.yaml}
  - arg: {name: environment, default: outdoor, description: "Mid-360 tuning profile: indoor or outdoor"}
  - arg: {name: display_mode, default: original, description: "Point display: original or height_limited (z <= 2.5 m)"}

  - node:
      pkg: spark_fast_lio
      exec: spark_lio_mapping
      name: lio_mapping
      output: screen
      on_exit: shutdown
      remap:
        - {from: 'lidar', to: '/livox/lidar'}
        - {from: 'imu', to: '/livox/imu'}
      param:
        - name: "common.lidar_frame"
          value: "livox_frame"
        - name: "common.imu_frame"
          value: "livox_frame"
        - name: "common.map_frame"
          value: "odom"
        - name: "common.base_frame"
          value: "livox_frame"
        - name: "gravity_alignment.enable_gravity_alignment"
          value: false
        - from: $(var config_path)
        - from: $(find-pkg-share spark_fast_lio)/config/mid360_$(var environment).yaml
        - name: "publish.display_mode"
          value: $(var display_mode)

  - node:
      if: $(var start_rviz)
      pkg: rviz2
      exec: rviz2
      name: rviz
      output: screen
      args: >
        -d $(find-pkg-share spark_fast_lio)/rviz/ouster_vbr.rviz
